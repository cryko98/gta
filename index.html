<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Lite</title>
    <style>
        :root {
            --primary: #00b7ff;
            --secondary: #ff3300;
            --dark: #111111;
            --darker: #000000;
            --light: #ffffff;
            --road: #333333;
            --gta-blue: #0066cc;
            --gta-green: #00cc66;
            --gta-purple: #9933cc;
            --gta-pink: #ff66cc;
            --gta-yellow: #ffcc00;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: var(--darker);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        h1 {
            color: var(--primary);
            text-shadow: 3px 3px 0 var(--secondary);
            font-size: 2.5rem;
            text-align: center;
        }
        
        .info-box {
            background-color: var(--dark);
            border: 2px solid var(--gta-yellow);
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
            width: 100%;
            color: var(--light);
            font-size: 0.9rem;
            overflow: hidden;
        }
        
        .score-container {
            display: flex;
            width: 100%;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .score-box {
            background-color: var(--dark);
            border: 2px solid var(--primary);
            border-radius: 8px;
            padding: 8px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        
        .score-box .label {
            font-size: 0.7rem;
            color: var(--primary);
            margin-bottom: 3px;
            font-weight: bold;
        }
        
        .game-area {
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 70vh;
            background-color: var(--dark);
            border: 4px solid var(--primary);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            background-image: 
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(50, 50, 50, 0.5) 50px,
                    rgba(50, 50, 50, 0.5) 52px
                ),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(50, 50, 50, 0.5) 50px,
                    rgba(50, 50, 50, 0.5) 52px
                );
        }
        
        .building {
            position: absolute;
            background-color: var(--gta-blue);
            border: 1px solid black;
            z-index: 2;
        }
        
        .road {
            position: absolute;
            background-color: var(--road);
            z-index: 1;
        }
        
        .road.horizontal {
            height: 40px;
            width: 100%;
        }
        
        .road.vertical {
            width: 40px;
            height: 100%;
        }
        
        .road-line {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.5);
            z-index: 2;
        }
        
        .road-line.horizontal {
            height: 2px;
            width: 20px;
        }
        
        .road-line.vertical {
            width: 2px;
            height: 20px;
        }
        
        .controls {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: center;
        }
        
        .game-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .primary-btn, .secondary-btn {
            font-family: Arial, sans-serif;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            color: var(--dark);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .primary-btn {
            background: var(--primary);
        }
        
        .secondary-btn {
            background: var(--secondary);
        }
        
        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .dpad {
            position: relative;
            width: 150px;
            height: 150px;
        }
        
        .direction-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 8px;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        
        .direction-btn.up {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .direction-btn.left {
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }
        
        .direction-btn.right {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
        }
        
        .direction-btn.down {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .action-btn {
            width: 80px;
            height: 60px;
            border-radius: 30px;
            background: var(--secondary);
            border: none;
            color: var(--light);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .player {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: var(--primary);
            border-radius: 5px;
            z-index: 10;
        }
        
        .player::after {
            content: '🚗';
            font-size: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .car {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 5px;
            z-index: 5;
        }
        
        .car.police::after {
            content: '🚓';
            font-size: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .car.taxi::after {
            content: '🚕';
            font-size: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .car.truck::after {
            content: '🚚';
            font-size: 2rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .coin {
            position: absolute;
            width: 30px;
            height: 30px;
            z-index: 5;
        }
        
        .coin::after {
            content: '💰';
            font-size: 1.5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            color: var(--primary);
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.5rem;
            z-index: 20;
            display: none;
        }
        
        .certificate-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.7);
            color: var(--gta-yellow);
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px solid var(--primary);
            font-size: 1rem;
            font-weight: bold;
            z-index: 15;
        }
        
        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }
            
            .game-buttons {
                flex-direction: row;
                justify-content: space-around;
            }
            
            .touch-controls {
                margin-top: 20px;
            }
            
            .dpad {
                width: 120px;
                height: 120px;
            }
            
            .direction-btn {
                width: 40px;
                height: 40px;
            }
            
            .action-btn {
                width: 60px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>GTA LITE</h1>
        <div class="info-box">
            <marquee scrollamount="5">Rockstar Games presents GTA Lite - a retro style game with old school graphics. Drive around the city, avoid cops, collect money and try to survive!</marquee>
        </div>
        <div class="score-container">
            <div class="score-box">
                <span class="label">SCORE</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="label">LIVES</span>
                <span id="lives">3</span>
            </div>
            <div class="score-box">
                <span class="label">LEVEL</span>
                <span id="level">1</span>
            </div>
            <div class="score-box">
                <span class="label">HIGH SCORE</span>
                <span id="highscore">0</span>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div id="message" class="message"></div>
            <div class="certificate-box">ca: 7t9CjkHX9jsHeenYe7RPPPUeC2z2KskT6B1B26cVpump</div>
        </div>

        <div class="controls">
            <div class="game-buttons">
                <button id="startBtn" class="primary-btn">START</button>
                <button id="resetBtn" class="secondary-btn">RESTART</button>
            </div>
            <div class="touch-controls">
                <div class="dpad">
                    <button id="upBtn" class="direction-btn up">↑</button>
                    <button id="leftBtn" class="direction-btn left">←</button>
                    <button id="rightBtn" class="direction-btn right">→</button>
                    <button id="downBtn" class="direction-btn down">↓</button>
                </div>
                <div class="action-buttons">
                    <button id="honkBtn" class="action-btn">HONK</button>
                    <button id="boostBtn" class="action-btn">BOOST</button>
                </div>
            </div>
        </div>
    </div>

    <script>        
document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const gameArea = document.getElementById('gameArea');
            const scoreEl = document.getElementById('score');
            const livesEl = document.getElementById('lives');
            const levelEl = document.getElementById('level');
            const highscoreEl = document.getElementById('highscore');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const messageEl = document.getElementById('message');
            
            // Control buttons
            const upBtn = document.getElementById('upBtn');
            const downBtn = document.getElementById('downBtn');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const honkBtn = document.getElementById('honkBtn');
            const boostBtn = document.getElementById('boostBtn');
            
            // Game state
            let score = 0;
            let lives = 3;
            let level = 1;
            let highscore = localStorage.getItem('gtaLiteHighscore') || 0;
            let player = null;
            let isGameRunning = false;
            let gameInterval = null;
            let carSpawnInterval = null;
            let cars = [];
            let coins = [];
            let keyStates = {
                up: false,
                down: false,
                left: false,
                right: false
            };
            
            // Display high score
            highscoreEl.textContent = highscore;
            
            // Configuration
            const config = {
                playerSpeed: 5,
                enemySpeed: 2,
                boardWidth: 0,
                boardHeight: 0,
                honkRadius: 100,
                boostDuration: 2000
            };
            
            // Update game area dimensions
            function updateDimensions() {
                config.boardWidth = gameArea.clientWidth;
                config.boardHeight = gameArea.clientHeight;
                
                // If player exists, check position
                if (player) {
                    const x = parseInt(player.style.left);
                    const y = parseInt(player.style.top);
                    
                    if (x > config.boardWidth - 50) {
                        player.style.left = `${config.boardWidth - 50}px`;
                    }
                    if (y > config.boardHeight - 50) {
                        player.style.top = `${config.boardHeight - 50}px`;
                    }
                }
            }
            
            // Show message
            function showMessage(text, duration = 2000) {
                messageEl.textContent = text;
                messageEl.style.display = 'block';
                
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, duration);
            }
            
            // Create player
            function createPlayer() {
                player = document.createElement('div');
                player.className = 'player';
                player.style.left = `${(config.boardWidth - 50) / 2}px`;
                player.style.top = `${config.boardHeight - 100}px`;
                gameArea.appendChild(player);
            }
            
            // Create car
            function createCar() {
                if (!isGameRunning) return;
                
                const car = document.createElement('div');
                const types = ['police', 'taxi', 'truck'];
                const type = types[Math.floor(Math.random() * types.length)];
                car.className = `car ${type}`;
                
                // Random position on screen edge
                let x, y, direction;
                const side = Math.floor(Math.random() * 4); // 0: top, 1: right, 2: bottom, 3: left
                
                switch (side) {
                    case 0: // Top
                        x = Math.random() * (config.boardWidth - 50);
                        y = -50;
                        direction = 'down';
                        break;
                    case 1: // Right
                        x = config.boardWidth;
                        y = Math.random() * (config.boardHeight - 50);
                        direction = 'left';
                        break;
                    case 2: // Bottom
                        x = Math.random() * (config.boardWidth - 50);
                        y = config.boardHeight;
                        direction = 'up';
                        break;
                    case 3: // Left
                        x = -50;
                        y = Math.random() * (config.boardHeight - 50);
                        direction = 'right';
                        break;
                }
                
                car.style.left = `${x}px`;
                car.style.top = `${y}px`;
                gameArea.appendChild(car);
                
                // Speed based on car type
                let speed;
                switch (type) {
                    case 'police':
                        speed = config.enemySpeed * 1.5; // Police: fast
                        break;
                    case 'taxi':
                        speed = config.enemySpeed; // Taxi: average
                        break;
                    case 'truck':
                        speed = config.enemySpeed * 0.7; // Truck: slow
                        break;
                    default:
                        speed = config.enemySpeed;
                }
                
                cars.push({
                    element: car,
                    x: x,
                    y: y,
                    direction: direction,
                    speed: speed + (level * 0.2), // Game gets harder with levels
                    type: type
                });
            }
            
            // Create coin
            function createCoin() {
                if (!isGameRunning) return;
                
                const coin = document.createElement('div');
                coin.className = 'coin';
                
                const x = Math.random() * (config.boardWidth - 30);
                const y = Math.random() * (config.boardHeight - 30);
                
                coin.style.left = `${x}px`;
                coin.style.top = `${y}px`;
                gameArea.appendChild(coin);
                
                coins.push({
                    element: coin,
                    x: x,
                    y: y
                });
            }
            
            // Game loop
            function gameLoop() {
                // Move player
                movePlayer();
                
                // Move cars
                moveCars();
                
                // Check coin collection
                checkCoinCollection();
                
                // Check collisions
                checkCollisions();
            }
            
            // Check if point is on a road
            function isOnRoad(x, y) {
                // Road positions
                const horizontalRoadPositions = [
                    Math.floor(config.boardHeight * 0.25),
                    Math.floor(config.boardHeight * 0.5),
                    Math.floor(config.boardHeight * 0.75)
                ];
                
                const verticalRoadPositions = [
                    Math.floor(config.boardWidth * 0.25),
                    Math.floor(config.boardWidth * 0.5),
                    Math.floor(config.boardWidth * 0.75)
                ];
                
                // Check horizontal roads (with padding)
                for (const roadY of horizontalRoadPositions) {
                    if (y > roadY - 40 && y < roadY + 40) {
                        return true;
                    }
                }
                
                // Check vertical roads (with padding)
                for (const roadX of verticalRoadPositions) {
                    if (x > roadX - 40 && x < roadX + 40) {
                        return true;
                    }
                }
                
                return false;
            }
            
            // Move player
            function movePlayer() {
                if (!player) return;
                
                let x = parseInt(player.style.left);
                let y = parseInt(player.style.top);
                let newX = x;
                let newY = y;
                
                if (keyStates.up && y > 0) newY -= config.playerSpeed;
                if (keyStates.down && y < config.boardHeight - 50) newY += config.playerSpeed;
                if (keyStates.left && x > 0) newX -= config.playerSpeed;
                if (keyStates.right && x < config.boardWidth - 50) newX += config.playerSpeed;
                
                // Only update position if new position is on a road
                if (isOnRoad(newX + 25, newY + 25)) {
                    player.style.left = `${newX}px`;
                    player.style.top = `${newY}px`;
                }
            }
            
            // Move cars
            function moveCars() {
                for (let i = cars.length - 1; i >= 0; i--) {
                    const car = cars[i];
                    
                    switch (car.direction) {
                        case 'up':
                            car.y -= car.speed;
                            break;
                        case 'down':
                            car.y += car.speed;
                            break;
                        case 'left':
                            car.x -= car.speed;
                            break;
                        case 'right':
                            car.x += car.speed;
                            break;
                    }
                    
                    car.element.style.left = `${car.x}px`;
                    car.element.style.top = `${car.y}px`;
                    
                    // Check if car is out of bounds
                    if (car.x < -100 || car.x > config.boardWidth + 100 ||
                        car.y < -100 || car.y > config.boardHeight + 100) {
                        car.element.remove();
                        cars.splice(i, 1);
                    }
                }
            }
            
            // Check coin collection
            function checkCoinCollection() {
                if (!player) return;
                
                const playerX = parseInt(player.style.left);
                const playerY = parseInt(player.style.top);
                
                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    
                    if (playerX < coin.x + 30 &&
                        playerX + 50 > coin.x &&
                        playerY < coin.y + 30 &&
                        playerY + 50 > coin.y) {
                        
                        // Collect coin
                        coin.element.remove();
                        coins.splice(i, 1);
                        
                        // Increase score
                        score += 10;
                        scoreEl.textContent = score;
                        
                        // Check for level up
                        if (score >= level * 100) {
                            level++;
                            levelEl.textContent = level;
                            
                            // Increase difficulty
                            config.enemySpeed += 0.2;
                            
                            showMessage(`LEVEL ${level}!`);
                        }
                        
                        // Create new coin
                        setTimeout(createCoin, 1000);
                    }
                }
            }
            
            // Check collisions
            function checkCollisions() {
                if (!player) return;
                
                const playerX = parseInt(player.style.left);
                const playerY = parseInt(player.style.top);
                
                for (const car of cars) {
                    if (playerX < car.x + 40 &&
                        playerX + 40 > car.x &&
                        playerY < car.y + 40 &&
                        playerY + 40 > car.y) {
                        
                        // Collision occurred
                        lives--;
                        livesEl.textContent = lives;
                        
                        // Reposition player
                        player.style.left = `${(config.boardWidth - 50) / 2}px`;
                        player.style.top = `${config.boardHeight - 100}px`;
                        
                        // Visual feedback
                        player.style.opacity = '0.5';
                        setTimeout(() => {
                            player.style.opacity = '1';
                        }, 1000);
                        
                        // Check game over
                        if (lives <= 0) {
                            endGame();
                        } else {
                            showMessage(`Collision! ${lives} lives left`);
                        }
                        
                        break;
                    }
                }
            }
            
            // Honk function
            function performHonk() {
                if (!isGameRunning || !player) return;
                
                const playerX = parseInt(player.style.left) + 25;
                const playerY = parseInt(player.style.top) + 25;
                
                // Visual effect
                const honkEffect = document.createElement('div');
                honkEffect.style.position = 'absolute';
                honkEffect.style.left = `${playerX}px`;
                honkEffect.style.top = `${playerY}px`;
                honkEffect.style.width = `${config.honkRadius * 2}px`;
                honkEffect.style.height = `${config.honkRadius * 2}px`;
                honkEffect.style.backgroundColor = 'rgba(255, 204, 0, 0.3)';
                honkEffect.style.borderRadius = '50%';
                honkEffect.style.transform = 'translate(-50%, -50%)';
                honkEffect.style.zIndex = '12';
                gameArea.appendChild(honkEffect);
                
                // Fade animation
                let opacity = 0.3;
                const fadeInterval = setInterval(() => {
                    opacity -= 0.05;
                    honkEffect.style.opacity = opacity;
                    
                    if (opacity <= 0) {
                        clearInterval(fadeInterval);
                        honkEffect.remove();
                    }
                }, 50);
                
                // Push nearby cars
                for (const car of cars) {
                    const carCenterX = car.x + 25;
                    const carCenterY = car.y + 25;
                    
                    const dx = carCenterX - playerX;
                    const dy = carCenterY - playerY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < config.honkRadius) {
                        // Push direction
                        const pushX = (dx / distance) * 50;
                        const pushY = (dy / distance) * 50;
                        
                        // Push car
                        car.x += pushX;
                        car.y += pushY;
                        car.element.style.left = `${car.x}px`;
                        car.element.style.top = `${car.y}px`;
                    }
                }
                
                showMessage('HONK!', 500);
            }
            
            // Boost function
            function performBoost() {
                if (!isGameRunning) return;
                
                // Increase speed
                const originalSpeed = config.playerSpeed;
                config.playerSpeed = 10;
                
                // Visual feedback
                player.style.boxShadow = '0 0 15px rgba(255, 50, 0, 0.8)';
                
                // Reset timer
                setTimeout(() => {
                    config.playerSpeed = originalSpeed;
                    player.style.boxShadow = 'none';
                }, config.boostDuration);
                
                showMessage('BOOST!', 500);
            }
            
            // Start game
            function startGame() {
                // Check if game is already running
                if (isGameRunning) return;
                
                // Reset game state
                score = 0;
                lives = 3;
                level = 1;
                scoreEl.textContent = score;
                livesEl.textContent = lives;
                levelEl.textContent = level;
                isGameRunning = true;
                
                // Clear game area
                gameArea.innerHTML = '';
                
                // Reinstall message and certificate elements
                gameArea.appendChild(messageEl); // Keep message element
                
                // Add certificate box
                const certificateBox = document.createElement('div');
                certificateBox.className = 'certificate-box';
                certificateBox.textContent = 'ca: xxxxxxxxxxxxxxxxxxxxxxxxxxx';
                gameArea.appendChild(certificateBox);
                
                cars = [];
                coins = [];
                
                // Update dimensions
                updateDimensions();
                
                // Create environment
                createGameEnvironment();
                
                // Create player
                createPlayer();
                
                // Initial coins
                for (let i = 0; i < 5; i++) {
                    createCoin();
                }
                
                // Timed car generation
                carSpawnInterval = setInterval(() => {
                    if (cars.length < 8 + level) {
                        createCar();
                    }
                }, 2000);
                
                // Start game loop
                gameInterval = setInterval(gameLoop, 16);
                
                showMessage('Game Started!', 1000);
            }
            
            // Restart game
            function resetGame() {
                if (gameInterval) clearInterval(gameInterval);
                if (carSpawnInterval) clearInterval(carSpawnInterval);
                isGameRunning = false;
                startGame();
            }
            
            // End game
            function endGame() {
                isGameRunning = false;
                clearInterval(gameInterval);
                clearInterval(carSpawnInterval);
                
                // Check high score
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem('gtaLiteHighscore', highscore);
                    highscoreEl.textContent = highscore;
                }
                
                showMessage(`GAME OVER! Score: ${score}`, 3000);
                
                // Stop cars
                cars.forEach(car => {
                    car.speed = 0;
                });
            }
            
            // Keyboard events
            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                        keyStates.up = true;
                        break;
                    case 'ArrowDown':
                    case 's':
                        keyStates.down = true;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                        keyStates.left = true;
                        break;
                    case 'ArrowRight':
                    case 'd':
                        keyStates.right = true;
                        break;
                    case ' ': // Space (Honk)
                        performHonk();
                        break;
                    case 'Shift': // Shift (Boost)
                        performBoost();
                        break;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                        keyStates.up = false;
                        break;
                    case 'ArrowDown':
                    case 's':
                        keyStates.down = false;
                        break;
                    case 'ArrowLeft':
                    case 'a':
                        keyStates.left = false;
                        break;
                    case 'ArrowRight':
                    case 'd':
                        keyStates.right = false;
                        break;
                }
            });
            
            // Touch screen buttons
            upBtn.addEventListener('mousedown', () => keyStates.up = true);
            upBtn.addEventListener('mouseup', () => keyStates.up = false);
            upBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keyStates.up = true; });
            upBtn.addEventListener('touchend', () => keyStates.up = false);
            
            downBtn.addEventListener('mousedown', () => keyStates.down = true);
            downBtn.addEventListener('mouseup', () => keyStates.down = false);
            downBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keyStates.down = true; });
            downBtn.addEventListener('touchend', () => keyStates.down = false);
            
            leftBtn.addEventListener('mousedown', () => keyStates.left = true);
            leftBtn.addEventListener('mouseup', () => keyStates.left = false);
            leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keyStates.left = true; });
            leftBtn.addEventListener('touchend', () => keyStates.left = false);
            
            rightBtn.addEventListener('mousedown', () => keyStates.right = true);
            rightBtn.addEventListener('mouseup', () => keyStates.right = false);
            rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keyStates.right = true; });
            rightBtn.addEventListener('touchend', () => keyStates.right = false);
            
            // Action buttons
            honkBtn.addEventListener('click', performHonk);
            boostBtn.addEventListener('click', performBoost);
            
            // Button events
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);
            
            // Window resize event
            window.addEventListener('resize', updateDimensions);
            
            // Initial dimensions
            updateDimensions();
            
            // Create game environment
            function createGameEnvironment() {
                // Create roads
                createRoads();
                
                // Create buildings
                createBuildings();
            }
            
            // Create roads
            function createRoads() {
                // Horizontal roads
                const horizontalRoadPositions = [
                    Math.floor(config.boardHeight * 0.25),
                    Math.floor(config.boardHeight * 0.5),
                    Math.floor(config.boardHeight * 0.75)
                ];
                
                horizontalRoadPositions.forEach(y => {
                    const road = document.createElement('div');
                    road.className = 'road horizontal';
                    road.style.top = `${y - 20}px`;
                    gameArea.appendChild(road);
                    
                    // Road markings
                    for (let x = 10; x < config.boardWidth; x += 60) {
                        const line = document.createElement('div');
                        line.className = 'road-line horizontal';
                        line.style.top = `${y - 1}px`;
                        line.style.left = `${x}px`;
                        gameArea.appendChild(line);
                    }
                });
                
                // Vertical roads
                const verticalRoadPositions = [
                    Math.floor(config.boardWidth * 0.25),
                    Math.floor(config.boardWidth * 0.5),
                    Math.floor(config.boardWidth * 0.75)
                ];
                
                verticalRoadPositions.forEach(x => {
                    const road = document.createElement('div');
                    road.className = 'road vertical';
                    road.style.left = `${x - 20}px`;
                    gameArea.appendChild(road);
                    
                    // Road markings
                    for (let y = 10; y < config.boardHeight; y += 60) {
                        const line = document.createElement('div');
                        line.className = 'road-line vertical';
                        line.style.left = `${x - 1}px`;
                        line.style.top = `${y}px`;
                        gameArea.appendChild(line);
                    }
                });
            }
            
            // Create buildings
            function createBuildings() {
                const buildingColors = [
                    'var(--gta-blue)',
                    'var(--gta-green)',
                    'var(--gta-purple)',
                    'var(--gta-pink)',
                    'var(--gta-yellow)'
                ];
                
                // Building placement zones (areas between roads)
                const zones = [
                    { x1: 0, y1: 0, x2: config.boardWidth * 0.25 - 40, y2: config.boardHeight * 0.25 - 40 },
                    { x1: config.boardWidth * 0.25 + 40, y1: 0, x2: config.boardWidth * 0.5 - 40, y2: config.boardHeight * 0.25 - 40 },
                    { x1: config.boardWidth * 0.5 + 40, y1: 0, x2: config.boardWidth * 0.75 - 40, y2: config.boardHeight * 0.25 - 40 },
                    { x1: config.boardWidth * 0.75 + 40, y1: 0, x2: config.boardWidth, y2: config.boardHeight * 0.25 - 40 },
                    
                    { x1: 0, y1: config.boardHeight * 0.25 + 40, x2: config.boardWidth * 0.25 - 40, y2: config.boardHeight * 0.5 - 40 },
                    { x1: config.boardWidth * 0.25 + 40, y1: config.boardHeight * 0.25 + 40, x2: config.boardWidth * 0.5 - 40, y2: config.boardHeight * 0.5 - 40 },
                    { x1: config.boardWidth * 0.5 + 40, y1: config.boardHeight * 0.25 + 40, x2: config.boardWidth * 0.75 - 40, y2: config.boardHeight * 0.5 - 40 },
                    { x1: config.boardWidth * 0.75 + 40, y1: config.boardHeight * 0.25 + 40, x2: config.boardWidth, y2: config.boardHeight * 0.5 - 40 },
                    
                    { x1: 0, y1: config.boardHeight * 0.5 + 40, x2: config.boardWidth * 0.25 - 40, y2: config.boardHeight * 0.75 - 40 },
                    { x1: config.boardWidth * 0.25 + 40, y1: config.boardHeight * 0.5 + 40, x2: config.boardWidth * 0.5 - 40, y2: config.boardHeight * 0.75 - 40 },
                    { x1: config.boardWidth * 0.5 + 40, y1: config.boardHeight * 0.5 + 40, x2: config.boardWidth * 0.75 - 40, y2: config.boardHeight * 0.75 - 40 },
                    { x1: config.boardWidth * 0.75 + 40, y1: config.boardHeight * 0.5 + 40, x2: config.boardWidth, y2: config.boardHeight * 0.75 - 40 },
                    
                    { x1: 0, y1: config.boardHeight * 0.75 + 40, x2: config.boardWidth * 0.25 - 40, y2: config.boardHeight },
                    { x1: config.boardWidth * 0.25 + 40, y1: config.boardHeight * 0.75 + 40, x2: config.boardWidth * 0.5 - 40, y2: config.boardHeight },
                    { x1: config.boardWidth * 0.5 + 40, y1: config.boardHeight * 0.75 + 40, x2: config.boardWidth * 0.75 - 40, y2: config.boardHeight },
                    { x1: config.boardWidth * 0.75 + 40, y1: config.boardHeight * 0.75 + 40, x2: config.boardWidth, y2: config.boardHeight }
                ];
                
                // 1-2 buildings per zone
                zones.forEach(zone => {
                    const buildingCount = 1 + Math.floor(Math.random() * 2); // 1-2 buildings per zone
                    
                    for (let i = 0; i < buildingCount; i++) {
                        const width = 30 + Math.floor(Math.random() * 40);
                        const height = 30 + Math.floor(Math.random() * 40);
                        
                        // Building position within zone
                        const x = zone.x1 + Math.floor(Math.random() * (zone.x2 - zone.x1 - width));
                        const y = zone.y1 + Math.floor(Math.random() * (zone.y2 - zone.y1 - height));
                        
                        // Create building
                        const building = document.createElement('div');
                        building.className = 'building';
                        building.style.width = `${width}px`;
                        building.style.height = `${height}px`;
                        building.style.left = `${x}px`;
                        building.style.top = `${y}px`;
                        building.style.backgroundColor = buildingColors[Math.floor(Math.random() * buildingColors.length)];
                        gameArea.appendChild(building);
                    }
                });
            }
            
            // Focus start button
            startBtn.focus();
        });
    </script>
</body>
</html>
